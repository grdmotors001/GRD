{% extends "base.html" %}
{% block content %}
<div class="panel" style="max-width:500px; margin:0 auto;">
  <h3 style="margin-top:0;">Password</h3>
  <p style="color:#666; font-size:12px;">Reset a user's login password. Unlike the original software, passwords are stored securely hashed, not in plain text.</p>

  <form class="stack" method="post" action="{{ url_for('custom_password') }}">
    <label>User</label>
    <select name="user_id" required>
      <option value="">-- Select User --</option>
      {% for u in users %}
      <option value="{{ u.id }}">{{ u.username }}{% if u.is_super_user %} (Super User){% endif %}</option>
      {% endfor %}
    </select>

    <label>New Password</label>
    <input type="password" name="new_password" required>

    <label>Confirm Password</label>
    <input type="password" name="confirm_password" required>

    <div class="btn-row">
      <button type="submit" class="btn-primary">🔒 Update Password</button>
    </div>
  </form>
</div>
{% endblock %}
